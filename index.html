<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Happy Birthday AR 🎂</title>

  <!-- A-Frame 1.3.0 + AR.js 3.4.5（安定して動く組み合わせ） -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 20px; z-index: 10;
      text-align: center; color: #fff; font-size: 16px; font-weight: 700;
      text-shadow: 0 1px 5px #000; pointer-events: none; padding: 0 16px;
    }
    #loader {
      position: fixed; inset: 0; z-index: 30; display: flex;
      align-items: center; justify-content: center; flex-direction: column;
      background: #17141a; color: #ffd9e6; font-weight: 700; gap: 14px;
    }
    #loader .dot { font-size: 40px; animation: pop 1s infinite ease-in-out; }
    @keyframes pop { 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.3);} }
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>

  <script>
    // ─────────────────────────────────────────────────────────
    // カードの面をCanvasで描画（日本語OK・高品質）
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('card-face', {
      schema: {
        variant: { default: 'cover' },        // 'cover' or 'inside'
        title:   { default: 'Happy Birthday!' },
        name:    { default: '' },
        message: { default: '' }              // 改行は | で区切る
      },
      init: function () {
        var d = this.data, el = this.el;
        var W = 560, H = 728;
        var c = document.createElement('canvas'); c.width = W; c.height = H;
        var x = c.getContext('2d');

        function roundRect(rx, ry, rw, rh, r) {
          x.beginPath();
          x.moveTo(rx + r, ry);
          x.arcTo(rx + rw, ry, rx + rw, ry + rh, r);
          x.arcTo(rx + rw, ry + rh, rx, ry + rh, r);
          x.arcTo(rx, ry + rh, rx, ry, r);
          x.arcTo(rx, ry, rx + rw, ry, r);
          x.closePath();
        }
        function heart(cx, cy, s) {
          x.save(); x.translate(cx, cy); x.scale(s, s);
          x.beginPath(); x.moveTo(0, 4);
          x.bezierCurveTo(-6, -4, -14, 2, 0, 14);
          x.bezierCurveTo(14, 2, 6, -4, 0, 4);
          x.closePath(); x.fill(); x.restore();
        }

        if (d.variant === 'cover') {
          var g = x.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, '#F0567F'); g.addColorStop(1, '#C4275A');
          x.fillStyle = g; x.fillRect(0, 0, W, H);
          x.strokeStyle = '#F7DE8B'; x.lineWidth = 18; x.strokeRect(24, 24, W - 48, H - 48);
          // リボン
          x.fillStyle = 'rgba(247,222,139,0.95)';
          x.fillRect(W / 2 - 26, 24, 52, H - 48);
          x.fillRect(24, H * 0.42 - 26, W - 48, 52);
          // リボンの結び目
          x.save(); x.translate(W / 2, H * 0.42);
          x.fillStyle = '#F7DE8B';
          x.beginPath(); x.ellipse(-46, 0, 42, 27, -0.4, 0, 7); x.fill();
          x.beginPath(); x.ellipse(46, 0, 42, 27, 0.4, 0, 7); x.fill();
          x.fillStyle = '#E7BE52'; x.beginPath(); x.arc(0, 0, 21, 0, 7); x.fill();
          x.restore();
          // タイトル
          x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
          x.font = 'bold 60px "Segoe UI","Yu Gothic",sans-serif';
          x.fillText(d.title, W / 2, H * 0.16);
          if (d.name) {
            x.font = 'bold 40px "Yu Gothic",sans-serif';
            x.fillText(d.name, W / 2, H * 0.71);
          }
          // タップ誘導
          x.fillStyle = 'rgba(255,255,255,0.94)';
          roundRect(W / 2 - 145, H - 122, 290, 64, 32); x.fill();
          x.fillStyle = '#C4275A'; x.font = 'bold 34px "Yu Gothic",sans-serif';
          x.fillText('タップして開く ▶', W / 2, H - 89);
        } else {
          x.fillStyle = '#FFF6FA'; x.fillRect(0, 0, W, H);
          x.strokeStyle = '#F7DE8B'; x.lineWidth = 16; x.strokeRect(20, 20, W - 40, H - 40);
          x.fillStyle = '#E23E6B'; x.textAlign = 'center'; x.textBaseline = 'middle';
          if (d.name) {
            x.font = 'bold 44px "Yu Gothic",sans-serif';
            x.fillText(d.name, W / 2, H * 0.2);
          }
          x.font = 'bold 40px "Yu Gothic",sans-serif';
          var lines = (d.message || '').split('|');
          var lh = 66, startY = H * 0.44 - (lines.length - 1) * lh / 2;
          for (var i = 0; i < lines.length; i++) x.fillText(lines[i], W / 2, startY + i * lh);
          x.fillStyle = '#FFB3C9';
          heart(W * 0.3, H * 0.82, 2.2); heart(W * 0.7, H * 0.82, 2.2); heart(W * 0.5, H * 0.88, 3);
        }

        var apply = function () {
          var mesh = el.getObject3D('mesh');
          if (!mesh) { el.addEventListener('object3dset', apply, { once: true }); return; }
          var tex = new THREE.CanvasTexture(c);
          if (THREE.sRGBEncoding !== undefined) tex.encoding = THREE.sRGBEncoding;
          tex.anisotropy = 8; tex.needsUpdate = true;
          mesh.material = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
        };
        apply();
      }
    });

    // ─────────────────────────────────────────────────────────
    // 紙吹雪バースト（'open' イベントで発火）
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('confetti', {
      schema: { count: { default: 70 }, on: { default: 'open' }, spread: { default: 1.4 } },
      init: function () {
        this.pieces = [];
        this.el.addEventListener(this.data.on, this.burst.bind(this));
      },
      burst: function () {
        this.clear();
        var colors = ['#FF5E8A', '#FFC24B', '#5AD1E6', '#9B7BFF', '#7CE38B', '#FF8AC2', '#FFFFFF'];
        for (var i = 0; i < this.data.count; i++) {
          var p = document.createElement('a-plane');
          p.setAttribute('width', 0.05); p.setAttribute('height', 0.08);
          p.setAttribute('material', 'shader: flat; side: double; color: ' + colors[i % colors.length] + '; opacity: 1');
          var x0 = (Math.random() - 0.5) * 0.25, y0 = 0.25 + Math.random() * 0.15, z0 = (Math.random() - 0.5) * 0.25;
          p.setAttribute('position', x0 + ' ' + y0 + ' ' + z0);
          var tx = (Math.random() - 0.5) * this.data.spread;
          var ty = 0.9 + Math.random() * 0.9;
          var tz = (Math.random() - 0.5) * this.data.spread;
          var px = x0 + tx * 0.45, py = y0 + ty, pz = z0 + tz * 0.45;
          p.setAttribute('animation__up',   'property: position; to: ' + px + ' ' + py + ' ' + pz + '; dur: 520; easing: easeOutQuad');
          p.setAttribute('animation__down', 'property: position; from: ' + px + ' ' + py + ' ' + pz + '; to: ' + (x0 + tx) + ' -0.05 ' + (z0 + tz) + '; dur: 1900; delay: 520; easing: easeInQuad');
          p.setAttribute('animation__spin', 'property: rotation; to: ' + (Math.random() * 720) + ' ' + (Math.random() * 720) + ' ' + (Math.random() * 720) + '; dur: 2400; easing: linear');
          p.setAttribute('animation__fade', 'property: material.opacity; from: 1; to: 0; dur: 700; delay: 1700; easing: linear');
          this.el.appendChild(p);
          this.pieces.push(p);
        }
        var self = this;
        if (this._to) clearTimeout(this._to);
        this._to = setTimeout(function () { self.clear(); }, 2700);
      },
      clear: function () {
        for (var i = 0; i < this.pieces.length; i++) {
          var el = this.pieces[i];
          if (el.parentNode) el.parentNode.removeChild(el);
        }
        this.pieces = [];
      }
    });

    // ─────────────────────────────────────────────────────────
    // 進行管理: 検知→カードのみ表示 / タップ→開く / 見失う→リセット
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('hbd-controller', {
      init: function () {
        var el = this.el, self = this, hint = document.getElementById('hint');
        this.state = 'idle';
        this._reset();

        el.addEventListener('markerFound', function () {
          if (self.state === 'idle') { self.state = 'ready'; el.emit('appear'); }
          hint.textContent = 'カードをタップして開いてね 💌';
        });
        el.addEventListener('markerLost', function () {
          self.state = 'idle'; self._reset();
          hint.textContent = 'Hiroマーカーにカメラを向けてね 🎂';
        });

        var tap = function () {
          if (self.state === 'ready') {
            self.state = 'opened';
            el.emit('open');
            hint.textContent = '🎉 Happy Birthday! 🎉';
          }
        };
        window.addEventListener('click', tap);
        window.addEventListener('touchend', tap);
      },
      _reset: function () {
        var set = function (id, a, v) { var e = document.getElementById(id); if (e) e.setAttribute(a, v); };
        set('cardGroup', 'scale', '0 0 0');
        set('cover', 'rotation', '0 0 0');
        set('cakeWrap', 'scale', '0 0 0');
      }
    });
  </script>
</head>

<body>
  <div id="loader"><div class="dot">🎂</div><div>読み込み中…</div></div>
  <div id="hint">Hiroマーカーにカメラを向けてね 🎂</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="20000">
      <a-asset-item id="cakeModel" src="assets/cake.glb"></a-asset-item>
    </a-assets>

    <a-marker preset="hiro" id="marker" hbd-controller
              smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">

      <!-- マーカーに固定するライト（暖色の点光源で華やかに） -->
      <a-entity light="type: ambient; intensity: 0.75"></a-entity>
      <a-entity light="type: directional; intensity: 0.5" position="0.5 2 1"></a-entity>
      <a-entity light="type: point; color: #FFD9A0; intensity: 1.1; distance: 3; decay: 2" position="0 1.1 0.6"></a-entity>
      <a-entity light="type: point; color: #FF9DBE; intensity: 0.6; distance: 3; decay: 2" position="-0.6 0.4 0.4"></a-entity>

      <!-- ── メッセージカード（検知で登場、タップで開く） ── -->
      <a-entity id="cardGroup" position="0 0.65 -0.05" scale="0 0 0"
                animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 450; easing: easeOutBack; startEvents: appear">

        <!-- 内側（開くと見えるメッセージ面）※ name / message を編集して使う -->
        <a-plane position="0 0 -0.03" width="1.0" height="1.3" material="side: double"
                 card-face="variant: inside;
                            name: ○○へ;
                            message: お誕生日おめでとう！|素敵な一年になりますように|いつもありがとう"></a-plane>

        <!-- 表紙（左端をヒンジに本のように開く） -->
        <a-entity id="cover" position="-0.5 0 0.015" rotation="0 0 0"
                  animation__open="property: rotation; from: 0 0 0; to: 0 -150 0; dur: 1100; easing: easeInOutCubic; startEvents: open">
          <a-plane position="0.5 0 0" width="1.0" height="1.3" material="side: double"
                   card-face="variant: cover; title: Happy Birthday!; name: ○○へ"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ── ケーキ（開くと回りながら地面から生える） ── -->
      <a-entity id="cakeWrap" position="0 0 0.4" scale="0 0 0"
                animation__grow="property: scale; from: 0 0 0; to: 1 1 1; dur: 1200; delay: 250; easing: easeOutBack; startEvents: open">
        <!-- 足元のやわらかい光 -->
        <a-circle rotation="-90 0 0" radius="0.62" position="0 0.002 0"
                  material="shader: flat; color: #FFE9B0; opacity: 0.28; transparent: true; side: double"></a-circle>
        <!-- ゆっくり自転（生えながら回る） -->
        <a-entity animation__spin="property: rotation; from: 0 0 0; to: 0 360 0; dur: 7000; loop: true; easing: linear">
          <!-- スケール0.78で高さ約0.7 / y=0.347で底が地面に接地 -->
          <a-gltf-model src="#cakeModel" scale="0.78 0.78 0.78" position="0 0.347 0"></a-gltf-model>
        </a-entity>
      </a-entity>

      <!-- 紙吹雪（'open'で発火。マーカーに追従） -->
      <a-entity confetti="on: open; count: 70; spread: 1.5" position="0 0.4 0.35"></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // 読み込み完了でローダーを消す
    var sc = document.querySelector('a-scene');
    var hide = function () { var l = document.getElementById('loader'); if (l) l.style.display = 'none'; };
    if (sc.hasLoaded) hide(); else sc.addEventListener('loaded', hide);
  </script>
</body>
</html>
