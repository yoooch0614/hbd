<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Happy Birthday AR</title>

  <!-- A-Frame 1.3.0 + AR.js 3.4.5 -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <!-- animation-mixer（スキン付きglTFアニメ再生用） -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #hint {
      position: fixed; left: 0; right: 0; bottom: 20px; z-index: 10;
      text-align: center; color: #fff; font-size: 16px; font-weight: 700;
      text-shadow: 0 1px 5px #000; pointer-events: none; padding: 0 16px;
    }
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>

  <script>
    // ─────────────────────────────────────────────────────────
    // カードの面をCanvasで描画（日本語OK・高品質）
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('card-face', {
      schema: {
        variant: { default: 'cover' },        // 'cover' or 'inside'
        title:   { default: 'Happy Birthday!' },
        name:    { default: '' },
        message: { default: '' }              // 改行は | で区切る
      },
      init: function () {
        var d = this.data, el = this.el;
        var W = 560, H = 728;
        var c = document.createElement('canvas'); c.width = W; c.height = H;
        var x = c.getContext('2d');

        function roundRect(rx, ry, rw, rh, r) {
          x.beginPath();
          x.moveTo(rx + r, ry);
          x.arcTo(rx + rw, ry, rx + rw, ry + rh, r);
          x.arcTo(rx + rw, ry + rh, rx, ry + rh, r);
          x.arcTo(rx, ry + rh, rx, ry, r);
          x.arcTo(rx, ry, rx + rw, ry, r);
          x.closePath();
        }
        function heart(cx, cy, s) {
          x.save(); x.translate(cx, cy); x.scale(s, s);
          x.beginPath(); x.moveTo(0, 4);
          x.bezierCurveTo(-6, -4, -14, 2, 0, 14);
          x.bezierCurveTo(14, 2, 6, -4, 0, 4);
          x.closePath(); x.fill(); x.restore();
        }

        if (d.variant === 'cover') {
          var g = x.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, '#F0567F'); g.addColorStop(1, '#C4275A');
          x.fillStyle = g; x.fillRect(0, 0, W, H);
          x.strokeStyle = '#F7DE8B'; x.lineWidth = 18; x.strokeRect(24, 24, W - 48, H - 48);
          // リボン
          x.fillStyle = 'rgba(247,222,139,0.95)';
          x.fillRect(W / 2 - 26, 24, 52, H - 48);
          x.fillRect(24, H * 0.42 - 26, W - 48, 52);
          // リボンの結び目
          x.save(); x.translate(W / 2, H * 0.42);
          x.fillStyle = '#F7DE8B';
          x.beginPath(); x.ellipse(-46, 0, 42, 27, -0.4, 0, 7); x.fill();
          x.beginPath(); x.ellipse(46, 0, 42, 27, 0.4, 0, 7); x.fill();
          x.fillStyle = '#E7BE52'; x.beginPath(); x.arc(0, 0, 21, 0, 7); x.fill();
          x.restore();
          // タイトル
          x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
          x.font = 'bold 60px "Segoe UI","Yu Gothic",sans-serif';
          x.fillText(d.title, W / 2, H * 0.16);
          if (d.name) {
            x.font = 'bold 40px "Yu Gothic",sans-serif';
            x.fillText(d.name, W / 2, H * 0.71);
          }
          // タップ誘導
          x.fillStyle = 'rgba(255,255,255,0.94)';
          roundRect(W / 2 - 145, H - 122, 290, 64, 32); x.fill();
          x.fillStyle = '#C4275A'; x.font = 'bold 34px "Yu Gothic",sans-serif';
          x.fillText('タップして開く ▶', W / 2, H - 89);
        } else {
          x.fillStyle = '#FFF6FA'; x.fillRect(0, 0, W, H);
          x.strokeStyle = '#F7DE8B'; x.lineWidth = 16; x.strokeRect(20, 20, W - 40, H - 40);
          x.fillStyle = '#E23E6B'; x.textAlign = 'center'; x.textBaseline = 'middle';
          if (d.name) {
            x.font = 'bold 44px "Yu Gothic",sans-serif';
            x.fillText(d.name, W / 2, H * 0.2);
          }
          x.font = 'bold 40px "Yu Gothic",sans-serif';
          var lines = (d.message || '').split('|');
          var lh = 66, startY = H * 0.44 - (lines.length - 1) * lh / 2;
          for (var i = 0; i < lines.length; i++) x.fillText(lines[i], W / 2, startY + i * lh);
          x.fillStyle = '#FFB3C9';
          heart(W * 0.3, H * 0.82, 2.2); heart(W * 0.7, H * 0.82, 2.2); heart(W * 0.5, H * 0.88, 3);
        }

        // A-Frame公式のmaterialパイプラインに乗せる（データURL経由で確実に適用）
        el.setAttribute('material', { shader: 'flat', side: 'double', src: c.toDataURL('image/png') });
      }
    });

    // ─────────────────────────────────────────────────────────
    // モデルのテクスチャをそのまま表示（陰影計算を切って“くすみ/汚れ”を回避）
    //  Meshy等の焼き込みテクスチャ用。ライトの陰影やAOの二重掛かりを防ぐ。
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('unlit-model', {
      schema: { brightness: { default: 1.0 } },   // 明るさ微調整（1=そのまま）
      init: function () {
        var el = this.el, b = this.data.brightness;
        el.addEventListener('model-loaded', function () {
          var mesh = el.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse(function (node) {
            if (!node.isMesh || !node.material) return;
            var mats = Array.isArray(node.material) ? node.material : [node.material];
            var conv = mats.map(function (m) {
              var basic = new THREE.MeshBasicMaterial({
                map: m.map || null,
                color: new THREE.Color(b, b, b),   // 焼き込み色をそのまま（必要なら明るさ調整）
                transparent: m.transparent,
                opacity: m.opacity,
                alphaTest: m.alphaTest,
                side: m.side
              });
              basic.toneMapped = false;             // トーンマッピングによる色のくすみを防止
              return basic;
            });
            node.material = Array.isArray(node.material) ? conv : conv[0];
          });
        });
      }
    });

    // ─────────────────────────────────────────────────────────
    // ランダム出演: カードを開くたびに lose/win/action からランダム選出
    //  - lose: 1体（アニメは1回のみ・最後の姿で静止）
    //  - win : 1体（ループ）／ lose と並べてケーキ左前に配置
    //  - action: 1体（ループ）／ kirua=前, momo=右奥, usa=左奥 に配置
    // ─────────────────────────────────────────────────────────
    var RND_SCALE = '0.267 0.267 0.267';  // 周回キャラと同じサイズに統一
    var RND_DELAY = 1900;                 // 登場後にアニメを再生開始する遅延(ms)
    var RND_LOSE = ['kirua_KO', 'kirua_down', 'momo_down', 'momo_shotdown', 'momo_wdown', 'usa_down', 'usa_shotdown'];
    var RND_WIN  = ['usa_kick', 'usa_punch'];
    // action候補: file=assets/からの相対パス(拡張子なし), pos=配置。周回キャラも候補に含める
    var RND_ACTION = [
      { file: 'random/action/kirua_breakdance', pos: '0 0 1.2', scale: '0.347 0.347 0.347' },   // kirua=前(1.3倍)
      { file: 'random/action/kirua_pendence',   pos: '0 0 1.2', scale: '0.347 0.347 0.347' },   // kirua=前(1.3倍)
      { file: 'random/action/momo_walk',        pos: '1.1 0 0' },   // momo=右中央
      { file: 'random/action/usa_breakdance',   pos: '-1.1 0 0' },  // usa=左中央
      { file: 'character_orbit',                pos: 'ORBIT' }       // 選ばれたら周回（正面には出さない）
    ];

    AFRAME.registerComponent('random-cast', {
      init: function () {
        this.el.addEventListener('open', this.roll.bind(this));
      },
      pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
      clear: function (wrapId) { var w = document.getElementById(wrapId); if (w) { while (w.firstChild) w.removeChild(w.firstChild); } },
      // wrap の中身を作り直す（毎回新規生成 → アニメは頭から再生される）
      // アニメ開始は RND_DELAY 遅らせる（登場前に再生し終わってしまうのを防ぐ）
      build: function (wrapId, path, opts) {
        var wrap = document.getElementById(wrapId);
        if (!wrap) return;
        while (wrap.firstChild) wrap.removeChild(wrap.firstChild);
        var m = document.createElement('a-entity');
        m.setAttribute('gltf-model', path);
        m.setAttribute('scale', opts.scale || RND_SCALE);
        m.setAttribute('position', '0 0 0');
        m.setAttribute('rotation', opts.rotation || '0 180 0'); // カメラ向き
        wrap.appendChild(m);
        var mix = (opts.loop === 'once')
          ? 'clip: *; loop: once; clampWhenFinished: true'
          : 'clip: *; loop: repeat';
        var delay = (opts.delay != null) ? opts.delay : RND_DELAY;
        setTimeout(function () {                 // 登場後に再生開始
          if (m.parentNode) m.setAttribute('animation-mixer', mix);
        }, delay);
      },
      roll: function () {
        // 登場順: action(5.6s) → lose/win(7.6s)
        // action：character_orbit が選ばれた時は正面に出さず周回させる
        var a = this.pick(RND_ACTION);
        var orbitP = document.getElementById('orbitCharParent');
        if (a.pos === 'ORBIT') {
          if (orbitP) orbitP.setAttribute('data-shown', 'yes'); // クローズ時に縮小対象にする印
          this.clear('actionChar');                 // 正面枠は空に
          setTimeout(function () {                    // action枠のタイミングで周回開始
            if (orbitP) orbitP.emit('orbitshow');
            var o = document.getElementById('orbitCharOrbit'); if (o) o.emit('orbitshow');
          }, 5600);
        } else {
          if (orbitP) orbitP.setAttribute('data-shown', ''); // 周回は出さない
          var wrap = document.getElementById('actionChar');
          if (wrap) wrap.setAttribute('position', a.pos);
          this.build('actionChar', 'assets/' + a.file + '.glb', { loop: 'repeat', rotation: '0 0 0', scale: a.scale, delay: 5700 }); // 前向き / kiruaは1.3倍
        }
        // lose（1回のみ・向きを反転）＋ win（ループ・90度回転）をケーキ左前に並べる
        // loseのアニメはwinより0.5s遅らせる
        this.build('winChar',  'assets/random/win/'  + this.pick(RND_WIN)  + '.glb', { loop: 'repeat', rotation: '0 270 0', delay: 7700 });
        this.build('loseChar', 'assets/random/lose/' + this.pick(RND_LOSE) + '.glb', { loop: 'once',   rotation: '0 90 0',  delay: 8200 });
      }
    });

    // ─────────────────────────────────────────────────────────
    // ケーキ周回キャラ: 'orbitshow' で周回開始（左横スタート・進行方向へ向く・速さのみランダム）
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('random-orbit', {
      go: function () {
        var el = this.el;
        var dur = 9000 + Math.floor(Math.random() * 8000); // 1周9〜17秒（速さのみランダム）
        var start = 180;                                    // 左横からスタート
        var end = start + 360;                              // 進行方向を一定に（逆回り防止）
        el.removeAttribute('animation__orbit');
        setTimeout(function () {
          el.setAttribute('animation__orbit',
            'property: rotation; from: 0 ' + start + ' 0; to: 0 ' + end + ' 0; dur: ' + dur + '; easing: linear; loop: true');
        }, 0);
      },
      init: function () { this.el.addEventListener('orbitshow', this.go.bind(this)); }
    });

    // ─────────────────────────────────────────────────────────
    // 紙吹雪バースト（'open' イベントで発火）
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('confetti', {
      schema: { count: { default: 70 }, on: { default: 'open' }, spread: { default: 1.4 } },
      init: function () {
        this.pieces = [];
        this.el.addEventListener(this.data.on, this.burst.bind(this));
      },
      burst: function () {
        this.clear();
        var colors = ['#FF5E8A', '#FFC24B', '#5AD1E6', '#9B7BFF', '#7CE38B', '#FF8AC2', '#FFFFFF'];
        for (var i = 0; i < this.data.count; i++) {
          var p = document.createElement('a-plane');
          p.setAttribute('width', 0.05); p.setAttribute('height', 0.08);
          p.setAttribute('material', 'shader: flat; side: double; color: ' + colors[i % colors.length] + '; opacity: 1');
          // 中央のノズルから噴き出す: 開始は狭く低く → 上へ噴き上がり → 扇状に広がって落下
          var x0 = (Math.random() - 0.5) * 0.12, y0 = 0.08 + Math.random() * 0.12, z0 = (Math.random() - 0.5) * 0.12;
          p.setAttribute('position', x0 + ' ' + y0 + ' ' + z0);
          var tx = (Math.random() - 0.5) * this.data.spread;
          var ty = 1.5 + Math.random() * 1.3;                     // 噴き上がる高さ（強め）
          var tz = (Math.random() - 0.5) * this.data.spread;
          var px = x0 + tx * 0.22, py = y0 + ty, pz = z0 + tz * 0.22;  // 頂点は細く（噴射のコーン）
          p.setAttribute('animation__up',   'property: position; to: ' + px + ' ' + py + ' ' + pz + '; dur: 430; easing: easeOutQuad');
          p.setAttribute('animation__down', 'property: position; from: ' + px + ' ' + py + ' ' + pz + '; to: ' + (x0 + tx) + ' -0.05 ' + (z0 + tz) + '; dur: 2200; delay: 430; easing: easeInQuad');
          p.setAttribute('animation__spin', 'property: rotation; to: ' + (Math.random() * 720) + ' ' + (Math.random() * 720) + ' ' + (Math.random() * 720) + '; dur: 2400; easing: linear');
          p.setAttribute('animation__fade', 'property: material.opacity; from: 1; to: 0; dur: 800; delay: 2000; easing: linear');
          this.el.appendChild(p);
          this.pieces.push(p);
        }
        var self = this;
        if (this._to) clearTimeout(this._to);
        this._to = setTimeout(function () { self.clear(); }, 3100);
      },
      clear: function () {
        for (var i = 0; i < this.pieces.length; i++) {
          var el = this.pieces[i];
          if (el.parentNode) el.parentNode.removeChild(el);
        }
        this.pieces = [];
      }
    });

    // ─────────────────────────────────────────────────────────
    // 効果音（Web Audioで合成 / 音源ファイル不要）
    // ─────────────────────────────────────────────────────────
    var SFX = (function () {
      var ctx = null, master = null, reverb = null, wet = null, melGain = null, melodyOn = false;

      // 残響（リバーブ）用のインパルス応答をノイズから合成 → 全体に“空気感/豊かさ”を付与
      function makeIR(c, dur, decay) {
        var rate = c.sampleRate, len = Math.floor(rate * dur), buf = c.createBuffer(2, len, rate);
        for (var ch = 0; ch < 2; ch++) {
          var d = buf.getChannelData(ch);
          for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
        return buf;
      }
      function ac() {
        if (!ctx) {
          ctx = new (window.AudioContext || window.webkitAudioContext)();
          master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
          reverb = ctx.createConvolver(); reverb.buffer = makeIR(ctx, 2.4, 2.6);
          wet = ctx.createGain(); wet.gain.value = 0.32; reverb.connect(wet); wet.connect(master);
          melGain = ctx.createGain(); melGain.gain.value = 0.55; melGain.connect(master); // オルゴール用（一括フェード可能に）
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
      }
      // ノードを master（＋任意で reverb）へ接続。dest 指定でグループ（melGain 等）へ差し替え可
      function send(node, revAmt, dest) {
        node.connect(dest || master);
        if (revAmt > 0) { var r = ctx.createGain(); r.gain.value = revAmt; node.connect(r); r.connect(reverb); }
      }
      // 単一オシレータのエンベロープ付きボイス
      function voice(freq, t, dur, o) {
        o = o || {};
        var osc = ctx.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
        if (o.glideTo) osc.frequency.exponentialRampToValueAtTime(o.glideTo, t + (o.glideDur || dur));
        var g = ctx.createGain(), peak = (o.gain != null ? o.gain : 0.2), atk = (o.attack != null ? o.attack : 0.008);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + atk);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); send(g, o.reverb != null ? o.reverb : 0.5, o.dest);
        osc.start(t); osc.stop(t + dur + 0.05);
      }
      // ベル/オルゴール音: 倍音を重ねてリッチな響きに（高次倍音ほど速く減衰）
      function bell(freq, t, dur, gain, dest) {
        gain = (gain != null ? gain : 0.2);
        var parts = [[1, 1], [2, 0.45], [3, 0.26], [4.2, 0.15], [5.4, 0.08]];
        parts.forEach(function (p, i) {
          voice(freq * p[0], t, Math.max(0.22, dur * Math.pow(0.82, i)),
            { type: 'sine', gain: gain * p[1], attack: 0.004, reverb: 0.45, dest: dest });
        });
      }

      // ── カードを開く/閉じる: めくる音（そのまま維持） ──
      function whoosh() {
        var c = ac(), t = c.currentTime, dur = 0.55;
        var buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
        var dt = buf.getChannelData(0);
        for (var i = 0; i < dt.length; i++) dt[i] = Math.random() * 2 - 1;
        var n = c.createBufferSource(); n.buffer = buf;
        var bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
        bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(2400, t + dur);
        var g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.22, t + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        n.connect(bp).connect(g).connect(c.destination); n.start(t); n.stop(t + dur);
      }

      // ── 開いた瞬間のファンファーレ（ジャジャーン） ──
      function fanfare() {
        var c = ac(), t = c.currentTime;
        // 前打ちの上がりベル
        [392, 523.25].forEach(function (f, i) { voice(f, t + i * 0.11, 0.22, { type: 'triangle', gain: 0.12, reverb: 0.4 }); });
        // 明るい金管風コード（ローパスを開いて“パッ”と輝かせる）
        var chord = [261.63, 329.63, 392.0, 523.25];
        chord.forEach(function (f) {
          var o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
          var lp = c.createBiquadFilter(); lp.type = 'lowpass';
          lp.frequency.setValueAtTime(900, t + 0.22); lp.frequency.linearRampToValueAtTime(2600, t + 0.4);
          var g = c.createGain();
          g.gain.setValueAtTime(0.0001, t + 0.22); g.gain.linearRampToValueAtTime(0.1, t + 0.27);
          g.gain.setValueAtTime(0.09, t + 0.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.95);
          o.connect(lp).connect(g); send(g, 0.5); o.start(t + 0.22); o.stop(t + 1.0);
        });
      }

      // ── ケーキ出現: 豪華なきらめきベル・アルペジオ ──
      function chime() {
        var c = ac(), t0 = c.currentTime, notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach(function (f, i) { bell(f, t0 + i * 0.085, 1.2, 0.17); });
        voice(130.81, t0, 1.4, { type: 'triangle', gain: 0.1, attack: 0.05, reverb: 0.6 }); // 低音の土台
      }

      // ── 花吹雪: パーティークラッカー（コルク＋ホーン＋キラキラ） ──
      function pop() {
        var c = ac(), t = c.currentTime;
        // コルクが弾ける破裂音
        var buf = c.createBuffer(1, Math.floor(c.sampleRate * 0.16), c.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
        var n = c.createBufferSource(); n.buffer = buf;
        var hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 600;
        var ng = c.createGain(); ng.gain.value = 0.55; n.connect(hp).connect(ng); send(ng, 0.3);
        n.start(t); n.stop(t + 0.16);
        voice(900, t, 0.18, { type: 'square', glideTo: 200, gain: 0.13, reverb: 0.2 });      // 下降ピュン
        voice(392, t + 0.02, 0.3, { type: 'sawtooth', gain: 0.11, attack: 0.02, reverb: 0.3 }); // 短いホーン
        [1568, 2093, 2637, 3136].forEach(function (f, i) { bell(f, t + 0.04 + i * 0.05, 0.6, 0.11); }); // 舞い散るキラキラ
      }

      // ── オルゴールで🎵ハッピーバースデー（開いてる間の主旋律） ──
      function melody() {
        var c = ac(); melodyOn = true;
        melGain.gain.cancelScheduledValues(c.currentTime); melGain.gain.setValueAtTime(0.55, c.currentTime);
        var t0 = c.currentTime + 0.05, b = 0.42; // 1拍
        var G = 392, A = 440, B = 493.88, C = 523.25, D = 587.33;
        var seq = [ // [周波数, 開始拍, 長さ拍]  ハッピーバースデー2フレーズ
          [G, 0, 0.75], [G, 0.75, 0.25], [A, 1, 1], [G, 2, 1], [C, 3, 1], [B, 4, 2],
          [G, 6, 0.75], [G, 6.75, 0.25], [A, 7, 1], [G, 8, 1], [D, 9, 1], [C, 10, 2]
        ];
        seq.forEach(function (s) { bell(s[0], t0 + s[1] * b, Math.max(0.5, s[2] * b * 1.4), 0.13, melGain); });
        // やわらかいベース（小節頭）
        [[C / 2, 0], [G / 2, 3], [C / 2, 6], [G / 2, 9]].forEach(function (s) {
          voice(s[0], t0 + s[1] * b, b * 2.4, { type: 'triangle', gain: 0.06, attack: 0.04, reverb: 0.5, dest: melGain });
        });
      }
      function melodyOff() {
        if (!ctx || !melodyOn) return; melodyOn = false;
        melGain.gain.cancelScheduledValues(ctx.currentTime);
        melGain.gain.setValueAtTime(melGain.gain.value, ctx.currentTime);
        melGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
      }

      // ── キャラ登場のキラキラ ──
      function twinkle() {
        var c = ac(), t = c.currentTime, base = [1046.5, 1318.5, 1568, 2093];
        for (var i = 0; i < 3; i++) {
          var f = base[Math.floor(Math.random() * base.length)] * (Math.random() < 0.5 ? 1 : 1.5);
          bell(f, t + i * 0.06, 0.5, 0.09);
        }
      }
      // ── キャラ登場音（旧・ぴょん音のスプリング感を流用） ──
      function appear() {
        var c = ac(), t = c.currentTime;
        var o = c.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(520, t + 0.09);
        o.frequency.exponentialRampToValueAtTime(300, t + 0.2);
        var g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.1, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); send(g, 0.25); o.start(t); o.stop(t + 0.24);
      }
      // ── バニーのはねる音（新規: やわらかい “ぽよん”） ──
      function hop() {
        var c = ac(), t = c.currentTime;
        var o = c.createOscillator(); o.type = 'triangle';
        o.frequency.setValueAtTime(440, t);
        o.frequency.exponentialRampToValueAtTime(170, t + 0.13);
        var g = c.createGain();
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.075, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.connect(g); send(g, 0.12); o.start(t); o.stop(t + 0.17);
      }
      // ── 閉じる時のやさしい下降ベル ──
      function sparkleDown() {
        var c = ac(), t = c.currentTime;
        [1046.5, 783.99, 659.25, 523.25].forEach(function (f, i) { bell(f, t + i * 0.08, 0.7, 0.11); });
      }

      return {
        ac: ac, whoosh: whoosh, fanfare: fanfare, chime: chime, pop: pop,
        melody: melody, melodyOff: melodyOff, twinkle: twinkle, appear: appear, hop: hop, sparkleDown: sparkleDown
      };
    })();

    function setHint(text) {
      var hint = document.getElementById('hint');
      if (hint) hint.textContent = text;
    }
    function initCameraHint() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setHint('カメラに対応していません');
        return;
      }
      setHint('ロード中、少々お待ちください');
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'camera' }).then(function (result) {
          if (result.state === 'granted') {
            setHint('カメラが起動したらマーカーを映してください');
          } else if (result.state === 'denied') {
            setHint('カメラの許可が必要です');
          }
          result.onchange = function () {
            if (result.state === 'granted') {
              setHint('カメラが起動したらマーカーを映してください');
            }
          };
        }).catch(function () {
          // ignore permissions API errors
        });
      }
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function (stream) {
          setHint('カメラが起動したらマーカーを映してください');
          stream.getTracks().forEach(function (track) { track.stop(); });
        }).catch(function () {
          setHint('カメラの許可が必要です');
        });
    }
    document.addEventListener('DOMContentLoaded', initCameraHint);

    // ─────────────────────────────────────────────────────────
    // 進行管理: 検知→カードのみ表示 / タップ→開く / 見失う→リセット
    // ─────────────────────────────────────────────────────────
    AFRAME.registerComponent('hbd-controller', {
      init: function () {
        var el = this.el, self = this, hint = document.getElementById('hint');
        this.state = 'idle';
        this._reset();

        // イベントは対象の子要素へ直接発火する（親→子には伝播しないため）
        var fire = function (ids, evt) {
          ids.forEach(function (id) { var e = document.getElementById(id); if (e) e.emit(evt); });
        };

        el.addEventListener('markerFound', function () {
          if (self.state === 'idle') { self.state = 'ready'; fire(['cardGroup'], 'appear'); }
          hint.textContent = 'カードをタップして開いてね';
        });
        el.addEventListener('markerLost', function () {
          if (self._closeTimer) { clearTimeout(self._closeTimer); self._closeTimer = null; }
          SFX.melodyOff();   // マーカーを見失ったらオルゴールも止める
          self.state = 'idle'; self._reset();
          hint.textContent = '再読み込みしてください';
        });

        // 10秒後に全オブジェクトを縮小＆カードを閉じ、再タップで開けるよう ready に戻す
        var CLOSE_AFTER = 10000;
        var closeSeq = function () {
          if (self.state !== 'opened') return;
          var closeIds = ['cover', 'cakeWrap', 'charTopper', 'hbdTopper', 'bunnyWrap', 'loseChar', 'winChar', 'actionChar'];
          var ob = document.getElementById('orbitCharParent');
          if (ob && ob.getAttribute('data-shown') === 'yes') closeIds.push('orbitCharParent'); // 出ていた時だけ縮小（未表示のフラッシュ防止）
          fire(closeIds, 'close');
          SFX.whoosh();          // 🔊 めくる音（そのまま）
          SFX.melodyOff();       // 🔊 オルゴールを止める
          SFX.sparkleDown();     // 🔊 閉じるときのやさしい下降音
          setTimeout(function () {
            if (self.state === 'opened') {
              self.state = 'ready';
              hint.textContent = 'もう一度タップで開くよ';
            }
          }, 1200);
        };

        var tap = function () {
          if (self.state === 'ready') {
            self.state = 'opened';
            SFX.ac();                                   // タップ（ユーザー操作）で音声を有効化
            fire(['cover', 'cakeWrap', 'charTopper', 'hbdTopper', 'bunnyWrap', 'loseChar', 'winChar', 'actionChar', 'randomCast'], 'open'); // カード開く＋ケーキ＋HBD/Konoka＋順次登場＋ランダム出演
            SFX.whoosh();                               // 🔊 めくる音（開いた瞬間はこれだけ）
            setTimeout(function () { if (self.state === 'opened') SFX.chime(); }, 700);   // 🔊 ケーキ出現音（生え始めに同期）
            setTimeout(function () {                          // 🔊 花吹雪（音と同時に発火）
              if (self.state !== 'opened') return;
              var cf = document.getElementById('confetti'); if (cf) cf.emit('open');
              SFX.pop();
            }, 1050);
            setTimeout(function () { if (self.state === 'opened') SFX.melody(); }, 1500);  // 🔊 オルゴールでハッピーバースデー
            setTimeout(function () { if (self.state === 'opened') SFX.appear(); }, 1650);  // 🔊 ケーキ上キャラ登場音
            setTimeout(function () {                                                        // 🔊 バニーのはねる音（新しい“ぽよん”／跳ねに同期）
              for (var k = 0; k < 5; k++) {
                setTimeout(function () { if (self.state === 'opened') SFX.hop(); }, k * 640);
              }
            }, 3700);
            setTimeout(function () { if (self.state === 'opened') SFX.appear(); }, 5650);  // 🔊 アクションキャラ登場音
            setTimeout(function () { if (self.state === 'opened') SFX.appear(); }, 7650);  // 🔊 win/loseキャラ登場音
            if (self._closeTimer) clearTimeout(self._closeTimer);
            self._closeTimer = setTimeout(closeSeq, CLOSE_AFTER);  // ⏱ 15秒後に自動で閉じる
            hint.textContent = ' Happy Birthday! ';
          }
        };
        window.addEventListener('click', tap);
        window.addEventListener('touchend', tap);
      },
      _reset: function () {
        var set = function (id, a, v) { var e = document.getElementById(id); if (e) e.setAttribute(a, v); };
        // 1) 予約・実行中の登場アニメ(anime.jsインスタンス)を一時停止 → 見失った後に遅延ポップが暴発するのを防ぐ。
        //    アニメ定義自体は残すので、次の open で beginAnimation され新規再生される（＝正常に復帰）。
        ['cardGroup', 'cover', 'cakeWrap', 'cakeSpin', 'charTopper', 'hbdTopper', 'hbdBob',
         'orbitCharParent', 'orbitCharOrbit', 'bunnyWrap', 'loseChar', 'winChar', 'actionChar'].forEach(function (id) {
          var e = document.getElementById(id); if (!e || !e.components) return;
          Object.keys(e.components).forEach(function (n) {
            if (n.indexOf('animation__') !== 0) return;
            var c = e.components[n];
            if (c && c.animation && typeof c.animation.pause === 'function') c.animation.pause();
          });
        });
        var orb = document.getElementById('orbitCharOrbit'); if (orb) orb.removeAttribute('animation__orbit'); // random-orbitが動的付与する周回を除去
        // 2) 基本姿勢へ戻す
        set('cardGroup', 'scale', '0 0 0');
        set('cover', 'rotation', '-90 0 0');
        set('cakeWrap', 'scale', '0 0 0');
        set('cakeWrap', 'rotation', '0 0 0');
        set('charTopper', 'scale', '0 0 0');
        set('hbdTopper', 'scale', '0 0 0');
        set('hbdTopper', 'position', '0 0.9 0');
        set('orbitCharParent', 'scale', '0 0 0');
        set('bunnyWrap', 'scale', '0 0 0');
        set('loseChar', 'scale', '0 0 0');
        set('winChar', 'scale', '0 0 0');
        set('actionChar', 'scale', '0 0 0');
      }
    });
  </script>
</head>

<body>
  <div id="hint">ロード中、少々お待ちください</div>

  <a-scene
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true;"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="20000">
      <a-asset-item id="cakeModel" src="assets/cake_rich.glb"></a-asset-item>
      <a-asset-item id="charModel" src="assets/char_top.glb"></a-asset-item>
      <a-asset-item id="orbitCharModel" src="assets/character_orbit.glb"></a-asset-item>
      <a-asset-item id="bunnyModel" src="assets/bunny.glb"></a-asset-item>
      <a-asset-item id="hbdModel" src="assets/HBD.glb"></a-asset-item>
      <a-asset-item id="konoModel" src="assets/Konoka.glb"></a-asset-item>
      <img id="coverImg" src="assets/card_cover.jpg" crossorigin="anonymous">
    </a-assets>

    <a-marker type="pattern" url="assets/markers/pattern-kono.patt" id="marker" hbd-controller
              smooth="true" smoothCount="8" smoothTolerance="0.01" smoothThreshold="4">

      <!-- マーカーに固定するライト（暖色の点光源で華やかに） -->
      <a-entity light="type: ambient; intensity: 0.75"></a-entity>
      <a-entity light="type: directional; intensity: 0.5" position="0.5 2 1"></a-entity>
      <a-entity light="type: point; color: #FFD9A0; intensity: 1.1; distance: 3; decay: 2" position="0 1.1 0.6"></a-entity>
      <a-entity light="type: point; color: #FF9DBE; intensity: 0.6; distance: 3; decay: 2" position="-0.6 0.4 0.4"></a-entity>

      <!-- ── バースデーカード（マーカー上に寝かせて設置 / タップで上開き） ── -->
      <a-entity id="cardGroup" position="0 0 0" scale="0 0 0"
                animation__in="property: scale; from: 0 0 0; to: 1 1 1; dur: 450; easing: easeOutBack; startEvents: appear">

        <!-- 中身（白紙）: マーカー上に平置き -->
        <a-plane id="cardBase" position="0 0.006 0" rotation="-90 0 0" width="2.0" height="1.5"
                 material="color: #FFFFFF; side: double; roughness: 1; metalness: 0"></a-plane>

        <!-- 表紙（奥の辺をヒンジに上へパタンと開く / 添付画像）
             閉: 平置きで画像が上向き, 開: 立ち上がって奥へ -->
        <a-entity id="cover" position="0 0.012 -0.75" rotation="-90 0 0"
                  animation__open="property: rotation; from: -90 0 0; to: -170 0 0; dur: 1200; easing: easeInOutCubic; startEvents: open"
                  animation__close="property: rotation; from: -170 0 0; to: -90 0 0; dur: 1000; easing: easeInOutCubic; startEvents: close">
          <!-- 表：添付画像（閉じたとき上を向く面） -->
          <a-plane position="0 -0.75 0.0015" width="2.0" height="1.5"
                   material="src: #coverImg; side: front; shader: flat"></a-plane>
          <!-- 裏：白紙（開くと見える面。裏写り防止） -->
          <a-plane position="0 -0.75 -0.0015" rotation="0 180 0" width="2.0" height="1.5"
                   material="color: #FFFFFF; side: front; shader: flat"></a-plane>
        </a-entity>
      </a-entity>

      <!-- ── ケーキ（開くと白紙の中央から回りながら生える） ── -->
      <a-entity id="cakeWrap" position="0 0 0" scale="0 0 0"
                animation__grow="property: scale; from: 0 0 0; to: 1 1 1; dur: 1300; delay: 700; easing: easeOutBack; startEvents: open"
                animation__spin="property: rotation; from: 0 360 0; to: 0 0 0; dur: 1500; delay: 700; easing: easeOutCubic; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 900; easing: easeInBack; startEvents: close">
        <!-- 足元のやわらかい光 -->
        <a-circle rotation="-90 0 0" radius="1.0" position="0 0.009 0"
                  material="shader: flat; color: #FFE9B0; opacity: 0.3; transparent: true; side: double"></a-circle>
        <!-- cake_rich.glb: スケール0.806で高さ約1.4 / y=0.702で底が接地 -->
        <!-- 内側でゆっくり常時回転（生える時のcakeWrap回転とは別軸なので競合しない） -->
        <a-entity id="cakeSpin"
                  animation__slowrot="property: rotation; from: 0 0 0; to: 0 360 0; dur: 22000; easing: linear; loop: true; startEvents: open">
          <a-gltf-model src="#cakeModel" scale="0.806 0.806 0.806" position="0 0.702 0"></a-gltf-model>
        </a-entity>
      </a-entity>

      <!-- ── ケーキの上のキャラ（アニメ付き / 開いてケーキが生えた後に登場） ── -->
      <!-- charModelEnt: scale0.1で高さ約0.4 / 足元=原点
           charTopper: y=0.88 でケーキ上面に立たせる。回転0=カメラ向き -->
      <a-entity id="charTopper" position="0 0.88 0" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 1600; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close">
        <a-entity id="charModelEnt" gltf-model="#charModel" animation-mixer="clip: *; loop: repeat; timeScale: 0.6"
                  scale="0.4 0.4 0.4" position="0 0 0" rotation="0 90 0"></a-entity>
      </a-entity>

      <!-- ── HBD.glb ＋ Konoka.glb（ケーキ上に飛び出して浮かぶ / HBDが上・Konokaが下・同時登場） ── -->
      <a-entity id="hbdTopper" position="0 0.9 0" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 600; delay: 1200; easing: easeOutBack; startEvents: open"
                animation__rise="property: position; from: 0 0.9 0; to: 0 1.5 0; dur: 750; delay: 1200; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close">
        <!-- 登場後にふわふわ上下 -->
        <a-entity id="hbdBob"
                  animation__float="property: position; from: 0 0 0; to: 0 0.07 0; dir: alternate; loop: true; dur: 1500; delay: 1900; easing: easeInOutSine; startEvents: open">
          <!-- HBD（上）: 幅約11.3 → scale0.18で幅約2.0 / 原点が左端なので x=-1.014 で中央寄せ -->
          <a-gltf-model src="#hbdModel" scale="0.18 0.18 0.18" position="-1.014 0.4 0" rotation="0 0 0"></a-gltf-model>
          <!-- Konoka（下）: 幅約2.67 → scale0.4で幅約1.07 / 原点が左寄りなので x=-0.526 で中央寄せ -->
          <a-gltf-model src="#konoModel" scale="0.4 0.4 0.4" position="-0.526 0 0" rotation="0 0 0"></a-gltf-model>
        </a-entity>
      </a-entity>

      <!-- ケーキの周りをまわるキャラ（毎回は出さない / actionでcharacter_orbitが選ばれた時だけ 'orbitshow' で登場） -->
      <a-entity id="orbitCharParent" position="0 0 0" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 0; easing: easeOutBack; startEvents: orbitshow"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close">
        <!-- random-orbit が速さをランダム化（左横スタート・進行方向へ向く） -->
        <a-entity id="orbitCharOrbit" position="0 0 0" random-orbit>
          <a-entity gltf-model="#orbitCharModel" animation-mixer="clip: *; loop: repeat"
                    scale="0.267 0.267 0.267" position="1.1 0 0" rotation="0 180 0"></a-entity>
        </a-entity>
      </a-entity>

      <!-- ── ぴょんぴょん跳ねるバニー（ケーキ右前 / モデルにアニメが無いのでプログラムで動かす） ── -->
      <a-entity id="bunnyWrap" position="0.85 0 0.9" rotation="0 -25 0" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 3600; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close">
        <!-- 上下の跳ね（着地→跳び上がりを繰り返す） -->
        <a-entity id="bunnyHop"
                  animation__hop="property: position; from: 0 0 0; to: 0 0.22 0; dir: alternate; loop: true; dur: 320; easing: easeOutQuad">
          <!-- 体の揺れ（左右へわずかに傾く） -->
          <a-entity gltf-model="#bunnyModel" unlit-model="brightness: 1.0" scale="0.4 0.4 0.4" position="0 0 0" rotation="0 0 0"
                    animation__sway="property: rotation; from: 0 0 -7; to: 0 0 7; dir: alternate; loop: true; dur: 640; easing: easeInOutSine"></a-entity>
        </a-entity>
      </a-entity>

      <!-- ── ランダム出演キャラ（開くたびに中身をrandom-castが差し替え） ── -->
      <!-- ケーキ左前に lose と win を並べる -->
      <a-entity id="loseChar" position="-0.95 0 0.8" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 7600; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close"></a-entity>
      <a-entity id="winChar" position="-0.68 0 0.92" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 7600; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close"></a-entity>
      <!-- action（位置はrandom-castがキャラに応じて設定） -->
      <a-entity id="actionChar" position="0 0 1.2" scale="0 0 0"
                animation__pop="property: scale; from: 0 0 0; to: 1 1 1; dur: 500; delay: 5600; easing: easeOutBack; startEvents: open"
                animation__shrink="property: scale; from: 1 1 1; to: 0 0 0; dur: 700; easing: easeInBack; startEvents: close"></a-entity>
      <!-- ランダム抽選のホスト（openを受けて上記3枠を毎回差し替え） -->
      <a-entity id="randomCast" random-cast></a-entity>

      <!-- 紙吹雪（'open'で発火。マーカーに追従） -->
      <a-entity id="confetti" confetti="on: open; count: 130; spread: 2.2" position="0 0.2 0"></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
