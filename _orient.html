<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <a-scene background="color: #333">
    <a-assets><a-asset-item id="hbd" src="assets/HBD.glb"></a-asset-item></a-assets>

    <!-- 地面（マーカー面の代わり・水平） -->
    <a-plane rotation="-90 0 0" width="12" height="12" color="#555" position="0 0 0"></a-plane>

    <!-- A: rotation 0 0 0（現状） 赤ラベル位置 x=-4 -->
    <a-entity position="-4 1 0">
      <a-gltf-model src="#hbd" scale="0.12 0.12 0.12" position="-0.676 0 0" rotation="0 0 0"></a-gltf-model>
      <a-text value="A: 0 0 0" position="0 -0.7 0" align="center" color="#fff" width="6"></a-text>
    </a-entity>
    <!-- B: rotation -90 0 0  x=0 -->
    <a-entity position="0 1 0">
      <a-gltf-model src="#hbd" scale="0.12 0.12 0.12" position="-0.676 0 0" rotation="-90 0 0"></a-gltf-model>
      <a-text value="B: -90 0 0" position="0 -0.7 0" align="center" color="#fff" width="6"></a-text>
    </a-entity>
    <!-- C: rotation 90 0 0  x=4 -->
    <a-entity position="4 1 0">
      <a-gltf-model src="#hbd" scale="0.12 0.12 0.12" position="-0.676 0 0" rotation="90 0 0"></a-gltf-model>
      <a-text value="C: 90 0 0" position="0 -0.7 0" align="center" color="#fff" width="6"></a-text>
    </a-entity>

    <a-entity light="type: ambient; intensity: 1"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 3"></a-entity>
    <!-- AR視点に近い: 少し上・前から見下ろす -->
    <a-camera position="0 3.2 6" rotation="-22 0 0" wasd-controls-enabled="false"></a-camera>
  </a-scene>
</body>
</html>
